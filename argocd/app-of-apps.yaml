apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: togglemaster-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/fiap-tech-challenge-devops/togglemaster-gitops.git
    targetRevision: main
    path: applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

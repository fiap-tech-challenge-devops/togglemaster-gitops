namespace: togglemaster
replicaCount: 2

image:
  repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/auth-service
  tag: v1.0.0-placeholder
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8001
  targetPort: 8001

autoscaling:
  enabled: false

readinessProbe:
  enabled: true
  path: /health
  port: 8001
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  enabled: true
  path: /health
  port: 8001
  initialDelaySeconds: 20
  periodSeconds: 20

env:
  - name: APP_ENV
    value: prod
  - name: PORT
    value: "8001"
  - name: AUTH_SERVICE_PORT
    value: "8001"

serviceAccount:
  create: true
  name: auth-service

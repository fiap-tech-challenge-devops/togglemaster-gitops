namespace: togglemaster
replicaCount: 2

image:
  repository: 762103020993.dkr.ecr.us-east-1.amazonaws.com/togglemaster/auth-service
  tag: fa2a8e65f4c8a2aae79a7dd69f84bae2ddf54fbf
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ecr-registry-secret

service:
  type: ClusterIP
  port: 8001
  targetPort: 8001

autoscaling:
  enabled: false

readinessProbe:
  enabled: true
  path: /health
  port: 8001
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  enabled: true
  path: /health
  port: 8001
  initialDelaySeconds: 20
  periodSeconds: 20

env:
  - name: APP_ENV
    value: prod
  - name: PORT
    value: "8001"
  - name: AUTH_SERVICE_PORT
    value: "8001"

secret:
  enabled: true
  name: auth-service-secrets

serviceAccount:
  create: true
  name: auth-service

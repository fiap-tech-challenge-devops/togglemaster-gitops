namespace: togglemaster
replicaCount: 2

image:
  repository: 762103020993.dkr.ecr.us-east-1.amazonaws.com/togglemaster/analytics-service
  tag: e6e8b76b4bb68c72980b08b1beded93a56310cc7
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ecr-registry-secret

service:
  type: ClusterIP
  port: 8005
  targetPort: 8005

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

readinessProbe:
  enabled: true
  path: /health
  port: 8005
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  enabled: true
  path: /health
  port: 8005
  initialDelaySeconds: 20
  periodSeconds: 20

env:
  - name: APP_ENV
    value: prod
  - name: PORT
    value: "8005"

# Ligado antes da instrumentacao: imagem sem SDK ignora estas variaveis, e a
# primeira imagem instrumentada ja nasce apontando para o Collector.
otel:
  enabled: true
  extraEnv:
    - name: OTEL_LOGS_EXPORTER
      value: otlp
    - name: OTEL_PYTHON_LOG_CORRELATION
      value: "true"
    - name: OTEL_PYTHON_FLASK_EXCLUDED_URLS
      value: health

configMapData:
  AWS_REGION: "us-east-1"
  AWS_SQS_URL: "https://sqs.us-east-1.amazonaws.com/762103020993/togglemaster-evaluation-events"
  AWS_DYNAMODB_TABLE: "ToggleMasterAnalytics"

configMap:
  enabled: true
  name: analytics-service-config

serviceAccount:
  create: true
  name: analytics-service
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::762103020993:role/role-eks-togglemaster-apps

keda:
  enabled: true
  queueURL: "https://sqs.us-east-1.amazonaws.com/762103020993/togglemaster-evaluation-events"
  queueLength: "500"
  minReplicaCount: 0
  maxReplicaCount: 15

namespace: togglemaster
replicaCount: 2

image:
  repository: 762103020993.dkr.ecr.us-east-1.amazonaws.com/togglemaster/flag-service
  tag: 42a8e4ef3f4a5ed77c39de9f3ffb9beaa6482757
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ecr-registry-secret

service:
  type: ClusterIP
  port: 8002
  targetPort: 8002

autoscaling:
  enabled: false

# ┌─ FALHA PROPOSITAL — DEMONSTRAÇÃO DA FASE 4 ─────────────────────────────┐
# │ Isto NÃO é configuração de verdade. Estrangula o flag-service para      │
# │ demonstrar falha em cascata: ele fica lento, o evaluation estoura o     │
# │ timeout de 5s e devolve 502.                                            │
# │                                                                         │
# │ 25m é 2,5% de um núcleo. O /health continua respondendo dentro do 1s    │
# │ da sonda — ele devolve JSON fixo —, enquanto /flags arrasta, porque     │
# │ passa pelo require_auth e pela query no Postgres.                       │
# │                                                                         │
# │ requests = limits de propósito: requests maior que limits faz o         │
# │ Kubernetes recusar o pod, e sem pod não há span nem demonstração.       │
# │                                                                         │
# │ O padrão do chart base é 500m. REVERTER ESTE COMMIT restaura.           │
# └─────────────────────────────────────────────────────────────────────────┘
resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    cpu: 25m
    memory: 512Mi

readinessProbe:
  enabled: true
  path: /health
  port: 8002
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  enabled: true
  path: /health
  port: 8002
  initialDelaySeconds: 20
  periodSeconds: 20

env:
  - name: APP_ENV
    value: prod
  - name: PORT
    value: "8002"

otel:
  enabled: true
  # Especificas do Python: log por OTLP, correlacao no stdout e o /health fora
  # do trace, que o probe bate a cada 20s.
  extraEnv:
    - name: OTEL_LOGS_EXPORTER
      value: otlp
    - name: OTEL_PYTHON_LOG_CORRELATION
      value: "true"
    - name: OTEL_PYTHON_FLASK_EXCLUDED_URLS
      value: health

configMapData:
  AUTH_SERVICE_URL: "http://auth-service:8001"

configMap:
  enabled: true
  name: flag-service-config

externalSecret:
  enabled: true
  name: flag-service-rds
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: togglemaster/rds/flags
        property: connection_string

serviceAccount:
  create: true
  name: flag-service

ingress:
  enabled: true
  groupOrder: "20"
  paths:
    - path: /flags

migration:
  enabled: true
  sql: |
    CREATE TABLE IF NOT EXISTS flags (
        id SERIAL PRIMARY KEY,
        name VARCHAR(100) UNIQUE NOT NULL,
        description TEXT,
        is_enabled BOOLEAN NOT NULL DEFAULT false,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );
    
    CREATE OR REPLACE FUNCTION trigger_set_timestamp()
    RETURNS TRIGGER AS $$
    BEGIN
      NEW.updated_at = NOW();
      RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;
    
    DROP TRIGGER IF EXISTS set_timestamp ON flags;
    
    CREATE TRIGGER set_timestamp
    BEFORE UPDATE ON flags
    FOR EACH ROW
    EXECUTE PROCEDURE trigger_set_timestamp();

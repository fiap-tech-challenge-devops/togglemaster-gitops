namespace: togglemaster
replicaCount: 2

image:
  repository: 762103020993.dkr.ecr.us-east-1.amazonaws.com/togglemaster/flag-service
  tag: d4caf20c532e17b93f5d8630fc97943be208b580
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ecr-registry-secret

service:
  type: ClusterIP
  port: 8002
  targetPort: 8002

autoscaling:
  enabled: false

readinessProbe:
  enabled: true
  path: /health
  port: 8002
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  enabled: true
  path: /health
  port: 8002
  initialDelaySeconds: 20
  periodSeconds: 20

env:
  - name: APP_ENV
    value: prod
  - name: PORT
    value: "8002"

configMapData:
  AUTH_SERVICE_URL: "http://auth-service:8001"

configMap:
  enabled: true
  name: flag-service-config

externalSecret:
  enabled: true
  name: flag-service-rds
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: togglemaster/rds/flags
        property: connection_string

serviceAccount:
  create: true
  name: flag-service

ingress:
  enabled: true
  groupOrder: "20"
  paths:
    - path: /flags

migration:
  enabled: true
  sql: |
    CREATE TABLE IF NOT EXISTS flags (
        id SERIAL PRIMARY KEY,
        name VARCHAR(100) UNIQUE NOT NULL,
        description TEXT,
        is_enabled BOOLEAN NOT NULL DEFAULT false,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );
    
    CREATE OR REPLACE FUNCTION trigger_set_timestamp()
    RETURNS TRIGGER AS $$
    BEGIN
      NEW.updated_at = NOW();
      RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;
    
    DROP TRIGGER IF EXISTS set_timestamp ON flags;
    
    CREATE TRIGGER set_timestamp
    BEFORE UPDATE ON flags
    FOR EACH ROW
    EXECUTE PROCEDURE trigger_set_timestamp();

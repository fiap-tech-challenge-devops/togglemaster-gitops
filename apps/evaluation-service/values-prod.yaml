namespace: togglemaster
replicaCount: 2

image:
  repository: 762103020993.dkr.ecr.us-east-1.amazonaws.com/togglemaster/evaluation-service
  tag: 8d6716322d833741b665c9161ad4723ea6b977d0
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ecr-registry-secret

service:
  type: ClusterIP
  port: 8004
  targetPort: 8004

autoscaling:
  enabled: false

readinessProbe:
  enabled: true
  path: /health
  port: 8004
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  enabled: true
  path: /health
  port: 8004
  initialDelaySeconds: 20
  periodSeconds: 20

env:
  - name: APP_ENV
    value: prod
  - name: PORT
    value: "8004"

serviceAccount:
  create: true
  name: evaluation-service

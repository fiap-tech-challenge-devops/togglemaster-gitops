# ClusterSecretStore criado pelo stage addons do togglemaster-iac.
#
# Existe para a senha do admin do Grafana ser estavel. Sem ela, o chart gera
# randAlphaNum 40 a cada render; como o Argo renderiza com `helm template`, o
# lookup do Secret existente volta vazio e a senha muda em toda sincronizacao.
# Ver ADR 0036.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: grafana-admin
    app.kubernetes.io/part-of: togglemaster
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: togglemaster/grafana/admin
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: togglemaster/grafana/admin
        property: admin-password

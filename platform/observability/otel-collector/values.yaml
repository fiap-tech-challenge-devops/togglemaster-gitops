# Valores do subchart opentelemetry-collector.
opentelemetry-collector:
  # Nome previsivel para o Service: otel-collector.observability.svc.cluster.local
  fullnameOverride: otel-collector

  mode: deployment
  replicaCount: 1

  # O distro k8s padrao do chart nao traz o exporter nem o connector do Datadog.
  image:
    repository: otel/opentelemetry-collector-contrib

  # Cria ServiceAccount, ClusterRole e binding exigidos pelo k8sattributes.
  presets:
    kubernetesAttributes:
      enabled: true

  # O no tem ~380m de CPU livres; acima disso o Karpenter sobe outro.
  resources:
    requests:
      cpu: 150m
      memory: 384Mi
    limits:
      memory: 768Mi

  extraEnvs:
    - name: DD_API_KEY
      valueFrom:
        secretKeyRef:
          name: datadog-api-key
          key: DD_API_KEY

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      # Desligados: o chart habilita por padrao e nada os consome ainda.
      jaeger: null
      zipkin: null
      prometheus: null

    processors:
      batch: {}
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25

    # Deriva as metricas de APM por servico a partir dos traces.
    connectors:
      datadog/connector: {}

    exporters:
      debug:
        verbosity: basic

      datadog:
        api:
          site: datadoghq.com
          key: ${env:DD_API_KEY}
        sending_queue:
          enabled: true
        retry_on_failure:
          enabled: true

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [debug, datadog/connector, datadog]
        metrics:
          receivers: [otlp, datadog/connector]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [debug, datadog]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [debug, datadog]

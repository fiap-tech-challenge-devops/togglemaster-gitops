# ClusterSecretStore criado pelo stage addons do togglemaster-iac.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: datadog-api-key
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: datadog-api-key
    app.kubernetes.io/part-of: togglemaster
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: datadog-api-key
    creationPolicy: Owner
  data:
    - secretKey: DD_API_KEY
      remoteRef:
        key: togglemaster/datadog/api-key
        property: DD_API_KEY
